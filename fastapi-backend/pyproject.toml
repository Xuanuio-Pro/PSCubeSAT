[tool.ruff]
target-version = "py310"
line-length = 100
include = ["*.py", "pyproject.toml"]
extend-exclude = ["build_cache", "data", "logs", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Direct CLI script adds the backend root before app imports.
"scripts/mqtt_probe.py" = ["E402"]
# env is injected by PlatformIO/SCons, not a missing Python variable.
"app/firmware/export_flash_manifest.py" = ["F821"]

[tool.ruff.format]
# Byte content is part of the trusted compiler image fingerprint.
exclude = ["app/firmware/export_flash_manifest.py"]
