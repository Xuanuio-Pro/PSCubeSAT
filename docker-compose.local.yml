# One-machine install: PostgreSQL + Redis + API + web on http://localhost:${LOCAL_PORT}.
# Created and driven by setup-local.ps1 / setup-local.sh (they write .env.local).
# Only the web port is published; the API, database and cache stay on the private network.
# Not for the public server: use deploy/server.sh with docker-compose.server.yml there.
name: ${LOCAL_PROJECT:-pscubesat-local}

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  APP_ENV: local
  DATABASE_URL: postgresql://cubesat:${POSTGRES_PASSWORD:?Run setup-local first}@postgres:5432/cubesat
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Run setup-local first}
  ALLOWED_ORIGINS: http://localhost:${LOCAL_PORT:-8080},http://127.0.0.1:${LOCAL_PORT:-8080}
  # Nginx overwrites X-Real-IP with the real peer; the API is reachable only through Nginx.
  CLIENT_IP_HEADER: X-Real-IP
  COMPILER_IMAGE: ${COMPILER_IMAGE:-pscubesat-compiler:1}
  LMS_CLASS_MODE: ${LMS_CLASS_MODE:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  # No MQTT broker in the local package; USB Serial telemetry works without it.
  MQTT_HOST: ${MQTT_HOST:-mqtt-not-configured}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: cubesat
      POSTGRES_USER: cubesat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup-local first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cubesat -d cubesat"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *bounded-logs
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  # Schema + curriculum snapshot; both are idempotent and safe on every start.
  migrate:
    image: pscubesat-backend:local
    build:
      context: ./fastapi-backend
    environment: *backend-env
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.services.curriculum_seed > /dev/null"]
    restart: "no"
    logging: *bounded-logs
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    image: pscubesat-backend:local
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - build_cache:/app/build_cache
      - backend_logs:/app/logs
      # Firmware builds run in the separate, network-less compiler image.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  frontend:
    image: pscubesat-frontend:local
    build:
      context: .
    restart: unless-stopped
    logging: *bounded-logs
    ports:
      - "${LOCAL_BIND:-0.0.0.0}:${LOCAL_PORT:-8080}:80"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      default:
        aliases:
          - nginx

volumes:
  postgres_data:
  redis_data:
  build_cache:
  backend_logs:
