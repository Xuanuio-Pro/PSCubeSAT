# Included in every location that sets its own add_header (nginx does not inherit them).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "serial=(self), camera=(), microphone=(), geolocation=(self)" always;
# Anti-framing: other sites cannot embed this app to trick users (clickjacking / phishing overlays).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
# Full resource policy is report-only first: browser console shows violations without breaking
# Google sign-in, map tiles, fonts or the 3D viewer. Enforce it after a clean observation period.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://*.googleusercontent.com; connect-src 'self' ws: wss: https://accounts.google.com https://fonts.gstatic.com; frame-src https://accounts.google.com; worker-src 'self' blob:" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Browsers honour HSTS only over HTTPS; plain-HTTP LAN access is unaffected.
add_header Strict-Transport-Security "max-age=31536000" always;
