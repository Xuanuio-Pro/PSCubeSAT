# Mosquitto Broker Configuration for PTIT-STEM-CUBE

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Authentication & Access Control
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Standard MQTT Listener (Non-TLS internal/local)
listener 1883 0.0.0.0

# ── Port 8883: Public (TLS, for ESP32 connecting from Internet) ───────────────
# Uncomment khi có TLS certificates trong thư mục ./mosquitto/certs:
# listener 8883 0.0.0.0
# protocol mqtt
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key

# WebSocket Listener
listener 9001 0.0.0.0
protocol websockets

