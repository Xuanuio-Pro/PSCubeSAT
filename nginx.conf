map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    add_header Permissions-Policy "serial=(self)" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Single Page Application (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to FastAPI backend container
    location /api/ {
        proxy_pass http://fastapi:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;

        # /api/compile chờ PlatformIO build tới 600s (xem compiler_svc.py) —
        # timeout mặc định 60s của nginx sẽ cắt kết nối giữa chừng nếu không nới.
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;

        # Body request (code) + response (firmware.bin base64) có thể vượt 1MB mặc định.
        client_max_body_size 20m;
        proxy_buffering off;
    }

    # Proxy WebSocket connection to FastAPI backend container
    location /ws {
        proxy_pass http://fastapi:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
