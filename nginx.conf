map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
    http http;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Re-resolve the API after container replacement instead of retaining its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend fastapi:8000;
    add_header Permissions-Policy "serial=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Single Page Application (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "serial=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Missing chunks must be 404, never the SPA HTML (stale deployment detection).
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy REST API requests to FastAPI backend container
    location /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;

        # /api/compile chờ PlatformIO build tới 600s (xem compiler_svc.py) —
        # timeout mặc định 60s của nginx sẽ cắt kết nối giữa chừng nếu không nới.
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;

        # Body request (code) + response (firmware.bin base64) có thể vượt 1MB mặc định.
        client_max_body_size 20m;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy WebSocket connection to FastAPI backend container
    location /ws {
        # Query string contains a JWT; never write it into access logs.
        access_log off;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
